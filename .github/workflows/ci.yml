# Tests bei jedem Push und Pull Request; nur bei einem Push auf main und nur wenn alle Tests grün
# sind, legt der Job "deploy" Code plus Frontend-Build im Branch "deploy" ab. Auf den Server kommt
# der Stand weiterhin von Hand (scripts/deploy.sh).
#
# Ablauf (parallel, README "GitHub Actions und Branch deploy"): PHP-Tests, Lint und Vitest, Build;
# die Browser-Tests laufen nach dem Build in acht Teilen (Matrix "shard") über alle fünf Profile
# gegen genau diesen Build (Artefakt frontend-dist), ihre Berichte führt "e2e-report" zusammen.
name: CI

on:
  # Änderungen nur an Markdown-Dateien (README, CLAUDE.md, docs/) lösen keinen Lauf aus und ändern
  # daher auch den Branch deploy nicht; der nächste Lauf mit Code nimmt sie mit.
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  # Erweiterungen wie auf STRATO (ohne intl und sodium).
  PHP_EXTENSIONS: pdo_mysql, mysqli, mbstring, gd, bcmath, dom, fileinfo, zip, curl, openssl

jobs:
  php:
    name: PHP-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Nur für diesen kurzlebigen Container; keine echten Zugangsdaten.
          MARIADB_DATABASE: firefighting_test
          MARIADB_USER: ff_test
          MARIADB_PASSWORD: ci-only-test-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: MariaDB-Client (mysqldump wie auf dem Server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mariadb-client
          mysqldump --version

      - name: Testdatenbank einstellen
        # Schneller, nur für Tests (README "Empfohlene Einstellung der lokalen MariaDB"); nie auf dem Server.
        run: mysql -h 127.0.0.1 -u root -pci-only-root-password -e "SET GLOBAL innodb_flush_log_at_trx_commit = 2;"

      - name: config/config.test.php anlegen
        run: |
          cat > config/config.test.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => '127.0.0.1',
                  'name' => 'firefighting_test',
                  'user' => 'ff_test',
                  'pass' => 'ci-only-test-password',
              ],
          ];
          PHP

      - name: Composer-Cache-Ordner
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      # Dieser Job legt den Cache an (mit Entwicklungspaketen); die Browser-Tests lesen ihn nur.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  frontend-checks:
    name: Lint und Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Lint und Formatierung
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm run test:unit

  frontend-build:
    name: Typprüfung und Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Typprüfung und Build
        working-directory: frontend
        run: npm run build

      # Genau dieser Build wird getestet (Job e2e) und kommt in den Branch deploy.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Browser-Tests (Teil ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Alle Teile laufen zu Ende, damit der Bericht vollständig ist.
      fail-fast: false
      matrix:
        # Mehr Teile: nur diese Liste verlängern ("--shard" liest die Anzahl aus job-total).
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      # PHP liefert den Build in den Browser-Tests aus (php -S, ohne Datenbank).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Composer-Cache-Ordner
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # Browser im Cache je Playwright-Version; die Systempakete installiert apt in jedem Lauf.
      - name: Playwright-Version
        id: playwright
        working-directory: frontend
        run: echo "version=$(npx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
      - name: Playwright-Browser aus dem Cache
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Systempakete der Browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium firefox webkit
      # Gleich nach dem Installieren speichern (nicht erst am Ende: dort nur bei Erfolg), nur Teil 1,
      # damit die Teile nicht gleichzeitig denselben Schlüssel anlegen.
      - name: Playwright-Browser in den Cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Teilbericht (Reporter blob, playwright.config.ts) für e2e-report; Traces gescheiterter Tests
      # stecken darin und zusätzlich in test-results/.
      - name: Teilbericht
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: frontend/blob-report/
          if-no-files-found: ignore
          retention-days: 1
      - name: Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    name: Bericht der Browser-Tests
    needs: e2e
    if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: frontend/all-blob-reports
          merge-multiple: true

      - name: Berichte zusammenführen
        working-directory: frontend
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Branch deploy aktualisieren
    needs: [php, frontend-checks, frontend-build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist

      - name: Code plus Build nach deploy
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/publish-deploy-branch.sh "$GITHUB_SHA" "$RUNNER_TEMP/frontend-dist"
