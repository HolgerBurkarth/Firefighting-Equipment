# Tests bei jedem Push und Pull Request; nur bei einem Push auf main und nur wenn alle nötigen Tests
# grün sind, legt der Job "deploy" Code plus Frontend-Build im Branch "deploy" ab. Auf den Server
# kommt der Stand weiterhin von Hand (scripts/deploy.sh).
#
# Ablauf (README "GitHub Actions und Branch deploy"): Lint und Vitest sowie der Build laufen immer.
# Der Job "changes" (frontend/build/ciScope.ts) bestimmt aus den geänderten Dateien seit dem letzten
# Stand in deploy (Pull Request: seit dessen Basis), ob PHP-Tests und welche Browser-Tests nötig
# sind; die Browser-Tests laufen nach dem Build in bis zu acht Teilen (Matrix "shard") über alle
# fünf Profile gegen genau diesen Build (Artefakt frontend-dist), ihre Berichte führt "e2e-report"
# zusammen. Nachts (schedule) und von Hand (workflow_dispatch) läuft alles, ohne deploy zu ändern.
name: CI

on:
  # Änderungen nur an Markdown-Dateien (README, CLAUDE.md, docs/) lösen keinen Lauf aus und ändern
  # daher auch den Branch deploy nicht; der nächste Lauf mit Code nimmt sie mit.
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  # Vollständiger Lauf jede Nacht (UTC; nicht zur vollen Stunde, dann ist GitHub stark ausgelastet).
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Der nächtliche Lauf hat eine eigene Gruppe: Er soll weder einen Push aufhalten noch von einem
  # Push abgebrochen werden.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  # Erweiterungen wie auf STRATO (ohne intl und sodium).
  PHP_EXTENSIONS: pdo_mysql, mysqli, mbstring, gd, bcmath, dom, fileinfo, zip, curl, openssl

jobs:
  changes:
    name: Betroffene Bereiche
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      php: ${{ steps.scope.outputs.php }}
      e2e: ${{ steps.scope.outputs.e2e }}
      e2e_files: ${{ steps.scope.outputs.e2e_files }}
      e2e_shards: ${{ steps.scope.outputs.e2e_shards }}
    steps:
      # Ganze Historie samt Branch deploy, damit die Basis und --only-changed sie finden.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # Basis: Push auf main = letzter main-Stand in deploy (dessen zweiter Elternteil ist der
      # main-Commit, also der gemeinsame Vorfahr). Nach einem roten Lauf bleibt deploy stehen, der
      # nächste Push prüft dann auch dessen Änderungen. Pull Request = seine Basis. Nachts, von Hand
      # oder ohne deploy: alles.
      - name: Basis
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=all
          if [ "$EVENT" = push ] && git rev-parse --verify -q origin/deploy >/dev/null; then
            base=$(git merge-base HEAD origin/deploy || echo all)
          elif [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD "$PR_BASE" || echo all)
          fi
          echo "Basis: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Bereiche bestimmen
        id: scope
        working-directory: frontend
        run: node build/ciScope.ts "${{ steps.base.outputs.base }}" >> "$GITHUB_OUTPUT"

  php:
    name: PHP-Tests
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Nur für diesen kurzlebigen Container; keine echten Zugangsdaten.
          MARIADB_DATABASE: firefighting_test
          MARIADB_USER: ff_test
          MARIADB_PASSWORD: ci-only-test-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      # mysqldump wie auf dem Server. Die .deb-Dateien liegen im Cache (Schlüssel = Version des Pakets
      # laut Paketliste des Runners und Version des Runner-Images); nur bei fehlendem Cache lädt apt sie
      # aus den Paketquellen (Ausfall der Ubuntu-Paketquellen am 11.11.2026, CI rot vor dem ersten Test).
      - name: Version des MariaDB-Clients
        id: mariadb-client
        run: |
          candidate=$(apt-cache policy mariadb-client | sed -n 's/^ *Candidate: //p')
          echo "id=${candidate:-unbekannt}-${ImageVersion:-ohne-image}" >> "$GITHUB_OUTPUT"
      - name: MariaDB-Client aus dem Cache
        id: mariadb-client-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/mariadb-client-debs
          key: mariadb-client-debs-${{ runner.os }}-${{ steps.mariadb-client.outputs.id }}
      - name: MariaDB-Client laden (nur ohne Cache)
        if: steps.mariadb-client-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends --download-only mariadb-client
          mkdir -p ~/mariadb-client-debs
          cp /var/cache/apt/archives/*.deb ~/mariadb-client-debs/
      - name: MariaDB-Client in den Cache
        if: steps.mariadb-client-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/mariadb-client-debs
          key: mariadb-client-debs-${{ runner.os }}-${{ steps.mariadb-client.outputs.id }}
      # Mit dpkg aus den lokalen Dateien, nicht mit apt-get: apt schlug fehl, weil die Paketlisten des
      # Runners älter sind als die zwischengespeicherten Pakete und es andere Versionen nachladen wollte
      # (CI 11.11.2026). Alle nötigen Abhängigkeiten liegen im Cache.
      - name: MariaDB-Client installieren
        run: |
          # Der MySQL-Client und -Server des Runner-Images stehen im Konflikt (apt hat ihn früher selbst entfernt).
          sudo dpkg --remove --force-depends mysql-client mysql-client-8.0 mysql-client-core-8.0 mysql-server mysql-server-8.0 mysql-server-core-8.0 || true
          sudo dpkg -i --auto-deconfigure ~/mariadb-client-debs/*.deb
          mysqldump --version

      - name: Testdatenbank einstellen
        # Schneller, nur für Tests (README "Empfohlene Einstellung der lokalen MariaDB"); nie auf dem Server.
        run: mysql -h 127.0.0.1 -u root -pci-only-root-password -e "SET GLOBAL innodb_flush_log_at_trx_commit = 2;"

      - name: config/config.test.php anlegen
        run: |
          cat > config/config.test.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => '127.0.0.1',
                  'name' => 'firefighting_test',
                  'user' => 'ff_test',
                  'pass' => 'ci-only-test-password',
              ],
          ];
          PHP

      - name: Composer-Cache-Ordner
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      # Dieser Job legt den Cache an (mit Entwicklungspaketen); die Browser-Tests lesen ihn nur.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  frontend-checks:
    name: Lint und Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Lint und Formatierung
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm run test:unit

  frontend-build:
    name: Typprüfung und Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Typprüfung und Build
        working-directory: frontend
        run: npm run build

      # Genau dieser Build wird getestet (Job e2e) und kommt in den Branch deploy.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # PHP und vendor/ für die Browser-Tests im Playwright-Container. Ohne apt: setup-php hing im
  # Container bei den Ubuntu-Paketquellen (CI 11.11.2026, drei von acht Teilen bis zum Abbruch).
  # PHP stammt aus dem offiziellen Image von Docker Hub (feste Version), vendor/ aus Composer auf dem
  # Runner; beides geht als ein tar-Archiv (artifact-Zip verliert Rechte) in den Job e2e. Im Image
  # fehlen gd, mysqli und pdo_mysql: `php -S` liefert in den Browser-Tests nur das Frontend aus und
  # braucht keine Datenbank, daher `--ignore-platform-reqs`. Version nur zusammen mit PHP_VERSION ändern.
  php-runtime:
    name: PHP für die Browser-Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Composer-Cache-Ordner
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: PHP aus dem Image holen
        env:
          PHP_IMAGE: php:8.5.12-cli-bookworm
        run: |
          mkdir -p php-runtime/lib
          docker run --rm -v "$PWD/php-runtime:/out" "$PHP_IMAGE" sh -c '
            set -e
            cp /usr/local/bin/php /out/php
            cp /usr/local/etc/php/php.ini-production /out/php.ini
            # Gemeinsame Bibliotheken des Images; die der C-Bibliothek hat der Playwright-Container (Ubuntu 24.04, neuer).
            ldd /usr/local/bin/php | awk "/=> \//{print \$3}" | grep -vE "/(libc|libm|libdl|libpthread|librt|libresolv|libutil)\.so" | xargs -r -I{} cp -L {} /out/lib/
          '
          ls php-runtime php-runtime/lib
          test ! -e vendor/composer/platform_check.php || { echo "::error::platform_check.php würde die fehlenden Erweiterungen im Container beanstanden"; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" php-runtime
          tar czf php-runtime.tgz php-runtime vendor

      - uses: actions/upload-artifact@v7
        with:
          name: php-runtime
          path: php-runtime.tgz
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Browser-Tests (Teil ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, frontend-build, php-runtime]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # Offizieller Playwright-Container: Browser und Systempakete sind schon darin, apt wird nicht
    # gebraucht (Ausfall der Ubuntu-Paketquellen am 11.11.2026). Die Version MUSS der von
    # @playwright/test in frontend/package-lock.json entsprechen (Schritt "Playwright-Version").
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # --ipc=host gegen Abstürze von Chromium durch zu kleinen gemeinsamen Speicher. HOME für Firefox
      # setzt der Schritt "Playwright" (der Runner überschreibt HOME der Schritte mit /github/home,
      # eine Angabe hier greift nicht: Firefox startete nicht, CI 11.11.2026).
      options: --ipc=host
    # Normal 3–6 min (Container ziehen kostet etwa 1 min).
    timeout-minutes: 25
    strategy:
      # Alle Teile laufen zu Ende, damit der Bericht vollständig ist.
      fail-fast: false
      matrix:
        # Anzahl aus dem Job "changes" (E2E_SHARDS in frontend/build/ciScope.ts bei allen Tests,
        # weniger bei wenigen betroffenen); "--shard" liest sie aus job-total.
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@v7

      # PHP liefert den Build in den Browser-Tests aus (php -S, ohne Datenbank); Programm und vendor/
      # kommen aus dem Job php-runtime. Der Wrapper setzt Bibliothekspfad und php.ini nur für php.
      - uses: actions/download-artifact@v8
        with:
          name: php-runtime
          path: ${{ runner.temp }}/php-runtime
      - name: PHP bereitstellen
        run: |
          tar xzf "$RUNNER_TEMP/php-runtime/php-runtime.tgz" -C /opt php-runtime
          tar xzf "$RUNNER_TEMP/php-runtime/php-runtime.tgz" -C "$GITHUB_WORKSPACE" vendor
          cat > /usr/local/bin/php <<'WRAPPER'
          #!/bin/sh
          export LD_LIBRARY_PATH=/opt/php-runtime/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          export PHPRC=/opt/php-runtime
          exec /opt/php-runtime/php "$@"
          WRAPPER
          chmod +x /usr/local/bin/php
          php -v
          php -m | paste -sd' ' -

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # Image und npm-Paket müssen dieselbe Playwright-Version haben, sonst fände Playwright seine
      # Browser nicht (sie liegen im Image unter PLAYWRIGHT_BROWSERS_PATH).
      - name: Playwright-Version
        working-directory: frontend
        run: |
          expected=1.64.1
          actual=$(npx playwright --version | sed 's/^Version //')
          echo "Playwright $actual, Image v$expected"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Playwright $actual aus package-lock.json, aber das Image im Job e2e ist v$expected. Tag des Images in .github/workflows/ci.yml anpassen."
            exit 1
          fi

      # E2E_FILES: nur die betroffenen Testdateien (leer = alle), siehe Job "changes".
      - name: Playwright
        working-directory: frontend
        env:
          E2E_FILES: ${{ needs.changes.outputs.e2e_files }}
          HOME: /root
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} $E2E_FILES

      # Teilbericht (Reporter blob, playwright.config.ts) für e2e-report; Traces gescheiterter Tests
      # stecken darin und zusätzlich in test-results/.
      - name: Teilbericht
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: frontend/blob-report/
          if-no-files-found: ignore
          retention-days: 1
      - name: Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    name: Bericht der Browser-Tests
    needs: e2e
    if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: frontend/all-blob-reports
          merge-multiple: true

      - name: Berichte zusammenführen
        working-directory: frontend
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Branch deploy aktualisieren
    needs: [changes, php, frontend-checks, frontend-build, php-runtime, e2e]
    # Übersprungene PHP- bzw. Browser-Tests (Bereich nicht betroffen) blockieren nicht; gescheiterte
    # oder abgebrochene schon. Nachts und von Hand nie (nur Push).
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.frontend-checks.result == 'success' &&
      needs.frontend-build.result == 'success' &&
      (needs.php.result == 'success' || needs.php.result == 'skipped') &&
      (needs.php-runtime.result == 'success' || needs.php-runtime.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist

      - name: Code plus Build nach deploy
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/publish-deploy-branch.sh "$GITHUB_SHA" "$RUNNER_TEMP/frontend-dist"
