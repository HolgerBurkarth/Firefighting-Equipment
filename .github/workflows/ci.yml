# Tests bei jedem Push und Pull Request; nur bei einem Push auf main und nur wenn alle Tests grün
# sind, legt der Job "deploy" Code plus Frontend-Build im Branch "deploy" ab. Auf den Server kommt
# der Stand weiterhin von Hand (scripts/deploy.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  # Erweiterungen wie auf STRATO (ohne intl und sodium).
  PHP_EXTENSIONS: pdo_mysql, mysqli, mbstring, gd, bcmath, dom, fileinfo, zip, curl, openssl

jobs:
  php:
    name: PHP-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Nur für diesen kurzlebigen Container; keine echten Zugangsdaten.
          MARIADB_DATABASE: firefighting_test
          MARIADB_USER: ff_test
          MARIADB_PASSWORD: ci-only-test-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: MariaDB-Client (mysqldump wie auf dem Server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mariadb-client
          mysqldump --version

      - name: Testdatenbank einstellen
        # Schneller, nur für Tests (README "Empfohlene Einstellung der lokalen MariaDB"); nie auf dem Server.
        run: mysql -h 127.0.0.1 -u root -pci-only-root-password -e "SET GLOBAL innodb_flush_log_at_trx_commit = 2;"

      - name: config/config.test.php anlegen
        run: |
          cat > config/config.test.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => '127.0.0.1',
                  'name' => 'firefighting_test',
                  'user' => 'ff_test',
                  'pass' => 'ci-only-test-password',
              ],
          ];
          PHP

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  frontend:
    name: Frontend-Tests und Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # PHP liefert den Build in den Browser-Tests aus (php -S, ohne Datenbank).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Lint und Formatierung
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm run test:unit

      - name: Typprüfung und Build
        working-directory: frontend
        run: npm run build

      - name: Playwright-Browser installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Playwright-Bericht
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      # Genau dieser getestete Build kommt in den Branch deploy.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Branch deploy aktualisieren
    needs: [php, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist

      - name: Code plus Build nach deploy
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/publish-deploy-branch.sh "$GITHUB_SHA" "$RUNNER_TEMP/frontend-dist"
