<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Konto wechseln (Handy)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;color:#1B2430;background:#F3F4F6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:10px;border:1px solid #C9D1DA;background:#fff;color:#1B2430;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-sizing:border-box;width:100%}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.acc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:2px solid #E1E5EA;background:#fff;cursor:pointer;width:100%;font:inherit;text-align:left;box-sizing:border-box;min-height:64px}
.logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.tabbtn{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 0;min-height:56px;justify-content:center;font-size:13px;color:#5B6675;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F6; overflow: hidden">
  <header style="background: {{color}}; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 14px; opacity: 0.9">{{city}}</span>
    <span style="font-size: 20px; font-weight: 700">Hallo Holger</span>
  </header>
  <div style="flex: 1 1 auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow: auto">
    <h1 style="margin: 0; font-size: 22px">Profil</h1>
    <section style="background: #FFFFFF; border: 1px solid #E1E5EA; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px">Konto wechseln</h2>
      <sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
        <button class="acc" type="button" onClick="{{a.pick}}" style="{{a.style}}" aria-current="{{a.current}}">
          <span class="logo" style="{{a.logoStyle}}">{{a.short}}</span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; line-height: 1.3"><span style="font-weight: 700; font-size: 16px">{{a.city}}</span><span style="font-size: 14px; color: #3A4655">{{a.role}}</span></span>
          <span class="chip" style="{{a.chipStyle}}">{{a.chip}}</span>
        </button>
      </sc-for>
      <button class="btn" type="button">+ Weitere Stadt hinzufügen …</button>
      <p style="margin: 0; font-size: 13px; color: #5B6675">Jede Stadt hat ihr eigenes Konto. Die Liste steht nur auf diesem Handy.</p>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #E1E5EA; border-radius: 12px; padding: 14px; font-size: 15px; color: #5B6675">Anzeige · Passwort · Angemeldete Geräte · Abmelden (wie bisher)</section>
  </div>
  <nav aria-label="Hauptmenü" style="display: flex; background: #FFFFFF; border-top: 1px solid #E1E5EA; padding-bottom: 8px">
    <a class="tabbtn" href="#">Suchen</a>
    <a class="tabbtn" href="#">Termine</a>
    <a class="tabbtn" href="#" style="color: #B71C1C; font-weight: 700">Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ACC = [
  { slug: 'hattingen', city: 'FF Hattingen', short: 'HA', color: '#1D3557', role: 'Benutzer', state: 'ok' },
  { slug: 'immendingen', city: 'FF Immendingen', short: 'IM', color: '#B71C1C', role: 'Admin', state: 'ok' },
  { slug: 'tuttlingen', city: 'FF Tuttlingen', short: 'TU', color: '#1B6330', role: 'Gerätewart', state: 'expired' }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: 'hattingen' }; }
  renderVals() {
    var s = this.state, self = this;
    var cur = ACC.filter(function (a) { return a.slug === s.cur; })[0];
    return {
      city: cur.city, color: cur.color,
      accounts: ACC.map(function (a) {
        var isCur = a.slug === s.cur;
        return {
          city: a.city, short: a.short, role: a.role,
          chip: isCur ? 'aktuell' : (a.state === 'expired' ? 'neu anmelden' : 'wechseln'),
          current: isCur ? 'true' : 'false',
          logoStyle: 'background: ' + a.color,
          style: isCur ? 'border-color: #B71C1C; background: #FDF5F5' : '',
          chipStyle: isCur ? 'background: #F8E6E6; color: #8E1515' : (a.state === 'expired' ? 'background: #FFF1DB; color: #7A4A00' : 'background: #EEF0F3; color: #3A4655'),
          pick: function () { if (!isCur && a.state !== 'expired') self.setState({ cur: a.slug }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
