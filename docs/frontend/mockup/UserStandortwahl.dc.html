<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>User Standortauswahl Handy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;color:#1B2430}
a{color:#1D3557}a:hover{color:#0F1F33}
.chip{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border-radius:10px;font:inherit;font-size:17px;cursor:pointer;text-align:left;box-sizing:border-box}
.st{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border-radius:12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.head{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 14px;border:0;font:inherit;color:#1B2430;text-align:left;cursor:pointer;box-sizing:border-box}
.sub{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 14px 6px 48px;border:0;font:inherit;color:#1B2430;text-align:left;cursor:pointer;box-sizing:border-box}
.head:active,.sub:active{filter:brightness(0.95)}
.cnt{font-size:13px;color:#5B6675;white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F6; overflow: hidden">

  <sc-if value="{{pickerOpen}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; height: 844px">
      <header style="background: #FFFFFF; border-bottom: 1px solid #E1E5EA; padding: 12px 8px 12px 8px; display: flex; align-items: center; gap: 4px">
        <button type="button" onClick="{{closePicker}}" aria-label="Abbrechen, zurück zum Umbuchen" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; border: 0; background: none; color: #1B2430; cursor: pointer">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
        </button>
        <div style="display: flex; flex-direction: column">
          <span style="font-weight: 700; font-size: 20px">Standort wählen</span>
          <span style="font-size: 14px; color: #5B6675">für M1 · Atemschutzmaske</span>
        </div>
      </header>

      <div style="padding: 12px 16px 8px 16px; display: flex; flex-direction: column; gap: 6px">
        <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 12px; padding: 0 12px; min-height: 52px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6675" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Standort suchen</span>
          <input type="search" placeholder="Suchen, z. B. HLF oder G1" value="{{q}}" onInput="{{onQ}}" style="border: 0; outline: none; font: inherit; font-size: 17px; flex-grow: 1; min-width: 0; background: transparent">
        </label>
        <span style="font-size: 14px; color: #5B6675">{{listHint}}</span>
      </div>

      <div style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px 16px; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
          <div style="flex-shrink: 0; background: #FFFFFF; border: {{g.border}}; border-radius: 12px; overflow: hidden; margin: {{g.margin}}; box-shadow: {{g.shadow}}">
            <button class="head" type="button" onClick="{{g.onTap}}" aria-expanded="{{g.expandedAttr}}" aria-label="{{g.ariaLabel}}" style="background: {{g.headBg}}; box-shadow: {{g.headBar}}">
              <sc-if value="{{g.isVehicle}}" hint-placeholder-val="{{ false }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A4655" stroke-width="2" aria-hidden="true"><path d="M2 16V7h12v9"></path><path d="M14 10h4l3 3v3h-7"></path><circle cx="6.5" cy="17" r="2"></circle><circle cx="17.5" cy="17" r="2"></circle></svg>
              </sc-if>
              <sc-if value="{{g.isRoom}}" hint-placeholder-val="{{ false }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A4655" stroke-width="2" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V8l7-4 7 4v13"></path><path d="M10 21v-5h4v5"></path></svg>
              </sc-if>
              <sc-if value="{{g.isExternal}}" hint-placeholder-val="{{ false }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A4655" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v6H4V6h6"></path></svg>
              </sc-if>
              <sc-if value="{{g.isSub}}" hint-placeholder-val="{{ false }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6675" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 11h16"></path></svg>
              </sc-if>
              <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
                <span style="font-size: 17px; font-weight: {{g.weight}}">{{g.label}}</span>
                <sc-if value="{{g.showParent}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 13px; color: #5B6675">{{g.parentName}}</span>
                </sc-if>
              </span>
              <sc-if value="{{g.isCurrent}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; font-weight: 700; color: #3A4655; background: #E3E9F2; border-radius: 999px; padding: 2px 8px">aktuell</span>
              </sc-if>
              <sc-if value="{{g.isSelected}}" hint-placeholder-val="{{ false }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" role="img" aria-label="gewählt"><path d="M5 12l5 5 9-10"></path></svg>
              </sc-if>
              <span class="cnt">{{g.countText}}</span>
              <sc-if value="{{g.hasChildren}}" hint-placeholder-val="{{ false }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A4655" stroke-width="2.5" aria-hidden="true" style="transform: {{g.rot}}; flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
              </sc-if>
            </button>
            <sc-if value="{{g.expanded}}" hint-placeholder-val="{{ false }}">
              <div style="background: #F6F8FB; border-top: 1px solid #D3DCE8">
                <sc-for list="{{g.children}}" as="c" hint-placeholder-count="4">
                  <button class="sub" type="button" onClick="{{c.pick}}" aria-label="{{c.ariaLabel}}" style="background: {{c.bg}}; box-shadow: {{c.bar}}; border-top: {{c.topBorder}}">
                    <sc-if value="{{c.isWhole}}" hint-placeholder-val="{{ false }}">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6675" stroke-width="2" aria-hidden="true"><path d="M2 16V7h12v9"></path><path d="M14 10h4l3 3v3h-7"></path><circle cx="6.5" cy="17" r="2"></circle><circle cx="17.5" cy="17" r="2"></circle></svg>
                    </sc-if>
                    <sc-if value="{{c.isFach}}" hint-placeholder-val="{{ true }}">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6675" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 11h16"></path></svg>
                    </sc-if>
                    <span style="flex-grow: 1; min-width: 0; font-size: 16px; font-weight: {{c.weight}}">{{c.label}}</span>
                    <sc-if value="{{c.isCurrent}}" hint-placeholder-val="{{ false }}">
                      <span style="font-size: 12px; font-weight: 700; color: #3A4655; background: #E3E9F2; border-radius: 999px; padding: 2px 8px">aktuell</span>
                    </sc-if>
                    <sc-if value="{{c.isSelected}}" hint-placeholder-val="{{ false }}">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" role="img" aria-label="gewählt"><path d="M5 12l5 5 9-10"></path></svg>
                    </sc-if>
                    <span class="cnt">{{c.countText}}</span>
                  </button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <sc-if value="{{noHits}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 24px 16px; text-align: center; color: #5B6675; font-size: 16px; background: #FFFFFF; border: 1px solid #E1E5EA; border-radius: 12px">Kein Standort passt zu „{{q}}“.</p>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{mainOpen}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; height: 844px">
      <header style="background: #FFFFFF; border-bottom: 1px solid #E1E5EA; padding: 12px 8px 12px 8px; display: flex; align-items: center; gap: 4px">
        <a href="UserStart.dc.html" aria-label="Zurück" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; color: #1B2430">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </a>
        <div style="display: flex; flex-direction: column">
          <span style="font-weight: 700; font-size: 20px">M1 · Atemschutzmaske</span>
          <span style="font-size: 14px; color: #5B6675">Jetzt: HLF 20 / G1 · einsatzbereit</span>
        </div>
      </header>

      <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-size: 17px">Standort</h2>
          <sc-for list="{{locations}}" as="l" hint-placeholder-count="3">
            <button class="chip" type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="border: {{l.border}}; background: {{l.bg}}; font-weight: {{l.weight}}; color: #1B2430">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
              <span style="flex-grow: 1">{{l.name}}</span>
              <span style="font-size: 13px; color: #5B6675">{{l.hint}}</span>
            </button>
          </sc-for>
          <button type="button" onClick="{{openPicker}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; background: none; border: 0; padding: 0 4px; font: inherit; font-size: 16px; font-weight: 600; color: {{accent}}; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            Anderen Standort suchen …
          </button>
        </section>

        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-size: 17px">Status</h2>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{statuses}}" as="s" hint-placeholder-count="3">
              <button class="st" type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="border: {{s.border}}; background: {{s.bg}}; color: {{s.fg}}">
                <span style="font-size: 22px; line-height: 1">{{s.symbol}}</span>
                {{s.label}}
              </button>
            </sc-for>
          </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 8px">
          <label for="kommentar2" style="font-size: 17px; font-weight: 700">{{commentLabel}}</label>
          <sc-if value="{{isDefect}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 15px; color: #9B1C1C">Bitte kurz beschreiben, was nicht funktioniert. Das hilft bei der Reparatur.</span>
          </sc-if>
          <textarea id="kommentar2" rows="2" placeholder="{{commentPlaceholder}}" style="font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: {{commentBorder}}; resize: none; box-sizing: border-box; width: 100%"></textarea>
        </section>
      </div>

      <div style="background: #FFFFFF; border-top: 1px solid #E1E5EA; padding: 12px 16px 22px 16px; display: flex; flex-direction: column; gap: 8px">
        <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #3A4655">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            Offline gespeichert, wird übertragen, sobald Netz da ist.
          </div>
        </sc-if>
        <button type="button" onClick="{{save}}" style="min-height: 56px; border-radius: 12px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Speichern</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D3557","options":["#1D3557","#7A1F1F","#2E5E3E","#4B3B7A"],"section":"Stadt"},"auswahlOffen":{"editor":"boolean","default":true,"section":"Zustand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loc: 'HLF 20 / G1', status: 'ready', saved: false, picker: null, q: '', open: { 'HLF 20': true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#1D3557';
    const current = 'HLF 20 / G1';
    const pickerOpen = this.state.picker === null ? (this.props.auswahlOffen ?? true) : this.state.picker;
    const choose = (path) => this.setState({ loc: path, picker: false, q: '', saved: false });

    const tree = [
      { name: 'HLF 20', kind: 'vehicle', children: [['G1', 6], ['G2', 3], ['G3', 2], ['Fahrerhaus', 3]] },
      { name: 'LF 10', kind: 'vehicle', children: [['G1', 4], ['G3', 3], ['Fahrerhaus', 2]] },
      { name: 'MTW', kind: 'vehicle', children: [['Fahrerhaus', 3]] },
      { name: 'Lager Gerätehaus', kind: 'room', own: 12, children: [] },
      { name: 'Kleiderkammer', kind: 'room', own: 5, children: [] },
      { name: 'Atemschutzwerkstatt', kind: 'external', own: 2, children: [] }
    ];
    const geraete = (n) => n === 1 ? '1 Gerät' : n + ' Geräte';
    const q = (this.state.q || '').trim().toLowerCase();
    const tokens = q ? q.split(/\s+/) : [];
    const matches = (s) => tokens.every((t) => s.toLowerCase().includes(t));
    const groups = [];
    const head = (o) => {
      const ex = !!o.expanded;
      const sel = !o.hasChildren && o.path === this.state.loc;
      return Object.assign({
        isVehicle: false, isRoom: false, isExternal: false, isSub: false,
        hasChildren: false, expanded: false, showParent: false, parentName: '', children: [],
        expandedAttr: o.hasChildren ? (ex ? 'true' : 'false') : null,
        isSelected: sel,
        isCurrent: !o.hasChildren && o.path === current,
        border: (ex || sel) ? '2px solid ' + accent : '1px solid #E1E5EA',
        margin: ex ? '10px 0 12px 0' : '0',
        shadow: ex ? '0 4px 14px rgba(20,30,50,0.14)' : 'none',
        headBg: ex ? '#E8EEF7' : (sel ? '#EEF2F8' : '#FFFFFF'),
        headBar: ex ? 'inset 5px 0 0 ' + accent : 'none',
        weight: (ex || sel) ? '700' : (o.isSub ? '400' : '600'),
        rot: ex ? 'rotate(90deg)' : 'none',
        ariaLabel: o.hasChildren ? o.label + (ex ? ', Fächer zuklappen' : ', Fächer aufklappen') : o.path + ' wählen',
        onTap: () => choose(o.path)
      }, o);
    };
    const sub = (path, label, count, i, whole) => {
      const sel = path === this.state.loc;
      return {
        label: label, countText: count === null ? '' : geraete(count),
        isWhole: whole, isFach: !whole, isSelected: sel, isCurrent: path === current,
        bg: sel ? '#DCE5F2' : 'transparent',
        bar: sel ? 'inset 4px 0 0 ' + accent : 'none',
        topBorder: i === 0 ? '0' : '1px solid #E3E8EF',
        weight: sel ? '700' : '400',
        ariaLabel: path + ' wählen',
        pick: () => choose(path)
      };
    };
    tree.forEach((p) => {
      const total = p.children.reduce((s, c) => s + c[1], 0) + (p.own || 0);
      const kinds = { isVehicle: p.kind === 'vehicle', isRoom: p.kind === 'room', isExternal: p.kind === 'external' };
      const hasKids = p.children.length > 0;
      if (tokens.length) {
        if (matches(p.name)) groups.push(head(Object.assign({ path: p.name, label: p.name, countText: geraete(total) }, kinds)));
        p.children.forEach((c) => {
          const path = p.name + ' / ' + c[0];
          if (matches(path)) groups.push(head({ path: path, label: c[0], countText: geraete(c[1]), isSub: true, showParent: true, parentName: p.name }));
        });
      } else {
        const isOpen = hasKids && !!this.state.open[p.name];
        const kids = isOpen
          ? [sub(p.name, 'Ganzes Fahrzeug, ohne Fach', null, 0, true)].concat(p.children.map((c, i) => sub(p.name + ' / ' + c[0], c[0], c[1], i + 1, false)))
          : [];
        groups.push(head(Object.assign({
          path: p.name, label: p.name, countText: geraete(total),
          hasChildren: hasKids, expanded: isOpen, children: kids,
          onTap: hasKids
            ? () => { const open = Object.assign({}, this.state.open); open[p.name] = !open[p.name]; this.setState({ open: open }); }
            : () => choose(p.name)
        }, kinds)));
      }
    });

    const recent = [
      { name: current, hint: 'aktuell' },
      { name: 'Lager Gerätehaus', hint: 'zuletzt' },
      { name: 'Atemschutzwerkstatt', hint: 'zuletzt' }
    ];
    let locs = recent;
    if (!recent.some((r) => r.name === this.state.loc)) {
      locs = [recent[0], { name: this.state.loc, hint: 'gewählt' }, recent[1]];
    }
    const locations = locs.map((l) => {
      const on = l.name === this.state.loc;
      return {
        name: l.name, hint: l.hint,
        pressed: on ? 'true' : 'false',
        border: on ? '2px solid ' + accent : '1px solid #C9D1DA',
        bg: on ? '#EEF2F8' : '#FFFFFF',
        weight: on ? '700' : '400',
        pick: () => this.setState({ loc: l.name, saved: false })
      };
    });
    const defs = [
      { key: 'ready', label: 'bereit', symbol: '✓', fg: '#1B6330', bgOn: '#E3F2E7', bdOn: '#1B6330' },
      { key: 'maintenance', label: 'Wartung', symbol: '◐', fg: '#7A4A00', bgOn: '#FFF1DB', bdOn: '#B86E00' },
      { key: 'defective', label: 'defekt', symbol: '✕', fg: '#9B1C1C', bgOn: '#FCE4E2', bdOn: '#9B1C1C' }
    ];
    const statuses = defs.map((d) => {
      const on = d.key === this.state.status;
      return {
        label: d.label, symbol: d.symbol, fg: d.fg,
        pressed: on ? 'true' : 'false',
        bg: on ? d.bgOn : '#FFFFFF',
        border: on ? '3px solid ' + d.bdOn : '1px solid #C9D1DA',
        pick: () => this.setState({ status: d.key, saved: false })
      };
    });
    const isDefect = this.state.status === 'defective';
    return {
      accent: accent,
      pickerOpen: pickerOpen,
      mainOpen: !pickerOpen,
      openPicker: () => this.setState({ picker: true }),
      closePicker: () => this.setState({ picker: false, q: '' }),
      q: this.state.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      listHint: tokens.length ? groups.length + ' Treffer' : 'Fahrzeug antippen klappt die Fächer auf. Fach antippen wählt es.',
      groups: groups,
      noHits: tokens.length > 0 && groups.length === 0,
      locations: locations,
      statuses: statuses,
      isDefect: isDefect,
      commentLabel: isDefect ? 'Was ist defekt?' : 'Kommentar (optional)',
      commentPlaceholder: isDefect ? 'z. B. Ausatemventil undicht' : 'z. B. nach Übung gereinigt',
      commentBorder: isDefect ? '2px solid #9B1C1C' : '1px solid #C9D1DA',
      saved: this.state.saved,
      save: () => this.setState({ saved: true })
    };
  }
}
</script>
</body>
</html>
