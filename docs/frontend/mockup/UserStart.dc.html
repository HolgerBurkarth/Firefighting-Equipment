<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>User Start Handy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;color:#1B2430}
a{color:#1D3557}a:hover{color:#0F1F33}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.b-ready{background:#E3F2E7;color:#1B6330}
.b-maint{background:#FFF1DB;color:#7A4A00}
.b-def{background:#FCE4E2;color:#9B1C1C}
.dev{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E1E5EA;border-radius:12px;padding:14px;text-decoration:none;color:#1B2430;min-height:64px;box-sizing:border-box}
.dev:hover{background:#F7F9FB;color:#1B2430}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;text-decoration:none;color:#5B6675;min-height:56px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F4F6; overflow: hidden">
  <header style="background: {{accent}}; color: #FFFFFF; padding: 18px 16px 16px 16px; display: flex; align-items: center; gap: 12px">
    <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column">
      <span style="font-weight: 700; font-size: 18px">FF Immendingen</span>
      <span style="font-size: 14px; opacity: 0.85">Hallo Jonas</span>
    </div>
  </header>

  <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="background: #3A4655; color: #FFFFFF; font-size: 15px; padding: 10px 16px; display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"></path><path d="M5 12a10 10 0 0 1 14 0"></path><path d="M8.5 15.5a5 5 0 0 1 7 0"></path><path d="M3 3l18 18"></path></svg>
      Offline. Buchungen werden später übertragen.
    </div>
  </sc-if>

  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 2px solid #C9D1DA; border-radius: 12px; padding: 0 14px; min-height: 56px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6675" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Gerät suchen</span>
      <input type="search" placeholder="Gerät suchen, z. B. M1" style="border: 0; outline: none; font: inherit; font-size: 18px; flex-grow: 1; min-width: 0; background: transparent">
    </label>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 12px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M20 16v3a1 1 0 0 1-1 1h-3"></path><path d="M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg>
      Code scannen
    </button>

    <h2 style="margin: 8px 0 0 0; font-size: 17px; color: #3A4655">Zuletzt benutzt</h2>

    <a class="dev" href="UserUmbuchen.dc.html">
      <span style="font-weight: 700; font-size: 19px; min-width: 52px">M1</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-size: 16px">Atemschutzmaske</span>
        <span style="font-size: 14px; color: #5B6675">HLF 20 / G1</span>
      </span>
      <span class="badge b-ready">✓ bereit</span>
    </a>
    <a class="dev" href="UserUmbuchen.dc.html">
      <span style="font-weight: 700; font-size: 19px; min-width: 52px">PA 3</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-size: 16px">Atemschutzgerät</span>
        <span style="font-size: 14px; color: #5B6675">LF 10 / G3</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span class="badge b-ready">✓ bereit</span>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #5B6675">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          wartet
        </span>
      </span>
    </a>
    <a class="dev" href="UserUmbuchen.dc.html">
      <span style="font-weight: 700; font-size: 19px; min-width: 52px">HRT 5</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-size: 16px">Funkgerät</span>
        <span style="font-size: 14px; color: #5B6675">MTW / Fahrerhaus</span>
      </span>
      <span class="badge b-def">✕ defekt</span>
    </a>
    <a class="dev" href="UserUmbuchen.dc.html">
      <span style="font-weight: 700; font-size: 19px; min-width: 52px">M10</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-size: 16px">Atemschutzmaske</span>
        <span style="font-size: 14px; color: #5B6675">Lager Gerätehaus</span>
      </span>
      <span class="badge b-maint">◐ Wartung</span>
    </a>
  </div>

  <nav aria-label="Navigation" style="display: flex; background: #FFFFFF; border-top: 1px solid #E1E5EA; padding-bottom: 10px">
    <a class="tab" href="UserStart.dc.html" style="color: {{accent}}; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      Suchen
    </a>
    <a class="tab" href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M8 3v4"></path><path d="M16 3v4"></path><path d="M4 10h16"></path></svg>
      Prüffristen
    </a>
    <a class="tab" href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>
      Profil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D3557","options":["#1D3557","#7A1F1F","#2E5E3E","#4B3B7A"],"section":"Stadt"},"offline":{"editor":"boolean","default":true,"section":"Zustand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#1D3557',
      offline: this.props.offline ?? true
    };
  }
}
</script>
</body>
</html>
