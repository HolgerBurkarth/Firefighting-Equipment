<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <!-- Platzhalter: der Server setzt /firefighting/<bereich>/ ein (siehe build/appBase.ts). -->
        <base href="/__FF_BASE__/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#b71c1c" />
        <title>Geräteverwaltung</title>
        <!-- Manifest nur unter Städten: setzt src/runtime/appearance.ts (linkManifest). -->
        <link rel="icon" type="image/png" href="api/v1/app-icon/192" vite-ignore />
        <link rel="apple-touch-icon" href="api/v1/app-icon/180" vite-ignore />
        <!-- Startbild: Stil (im CSS des Builds) und Bilder als Dateien, keine Ausnahme in der CSP. -->
        <link rel="stylesheet" href="/src/styles/splash.css" />
    </head>
    <body>
        <!--
            Startbild (Plan Phase 1, Schritt 1.7d): erst nach rund 0,4 s sichtbar (splash.css), die
            App entfernt es, sobald die erste Seite steht (src/runtime/splash.ts).
        -->
        <div id="splash" class="splash" data-step="start">
            <div class="splash-art" role="img" aria-label="Gezeichnetes Löschfahrzeug"></div>
            <div class="splash-text">
                <span class="splash-title" data-splash-title>Feuerwehr</span>
                <span class="splash-subtitle">Geräteverwaltung</span>
            </div>
            <div
                class="splash-track"
                role="progressbar"
                aria-label="App wird geladen"
                aria-valuemin="0"
                aria-valuemax="100"
            >
                <div class="splash-bar"></div>
            </div>
            <span class="splash-label" aria-live="polite" data-splash-label
                >App wird geladen …</span
            >
        </div>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
